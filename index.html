<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#6f4e37" />

    <title>Ethan Carpenter: Software Developer Portfolio</title>
    <meta
      name="description"
      content="Ethan Carpenter is a software developer with a Computer Science degree from UMass Amherst, building full-stack projects including a Dungeons & Dragons campaign manager. Set in an interactive pixel-art cafe."
    />
    <link rel="canonical" href="https://ethancarpenter.dev" />

    <!-- Open Graph / social -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ethan Carpenter" />
    <meta property="og:title" content="Ethan Carpenter: Software Developer Portfolio" />
    <meta
      property="og:description"
      content="Software developer with a CS degree and real full-stack projects. Toss a coffee bean while you browse."
    />
    <meta property="og:url" content="https://ethancarpenter.dev" />

    <!-- Twitter/X card (falls back to the Open Graph tags above where unset) -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Ethan Carpenter: Software Developer Portfolio" />
    <meta
      name="twitter:description"
      content="Software developer with a CS degree and real full-stack projects. Toss a coffee bean while you browse."
    />

    <!-- Inter: professional portfolio/UI type. Silkscreen: in-world pixel cafe only. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Silkscreen:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
