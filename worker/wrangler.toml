# Cloudflare Worker config for the global coffee-brew counter (Milestone 5).
# Run every `wrangler`/`npm run worker:*`/`npm run db:*` command from the repo
# root — the npm scripts already point at this file with --config.

name = "ethancarpenter-brew-counter"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# --- Production routing ------------------------------------------------
# Same-origin: the Vite site is served from ethancarpenter.dev (Cloudflare
# Pages) and only /api/* is peeled off to this Worker. A Worker route takes
# precedence over Pages for matching paths, so no CORS is ever involved.
# The client calls the relative path /api/brews (src/game/brew/brewApi.ts),
# never an absolute URL.
routes = [
  { pattern = "ethancarpenter.dev/api/*", zone_name = "ethancarpenter.dev" },
]

# The Worker is reachable ONLY through the route above. No *.workers.dev URL
# and no preview URLs in production (Cloudflare also disables workers.dev by
# default once a route is set; these lines make that explicit and silence the
# deploy warnings).
workers_dev = false
preview_urls = false

# --- D1: the persistent global counter ---------------------------------
[[d1_databases]]
binding = "DB"
database_name = "ethancarpenter-brews"
# Production database, created 2026-09-09 via `wrangler d1 create
# ethancarpenter-brews` (region ENAM). Binding stays "DB" (what worker/src
# references as env.DB) regardless of the snippet Cloudflare prints.
database_id = "37560459-5d6a-4bfa-b4a6-33f45d850342"
migrations_dir = "migrations"

# --- Rate limiting: a few accepted POSTs per visitor per minute --------
# Fully simulated by Miniflare in local dev — no account-level setup needed,
# unlike the D1 database above. namespace_id is just a number you pick (must
# be unique among this account's rate-limit bindings), not a provisioned
# resource.
[[ratelimits]]
name = "BREW_RATE_LIMITER"
namespace_id = "1001"

[ratelimits.simple]
limit = 5
period = 60
